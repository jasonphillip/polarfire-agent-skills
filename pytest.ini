[pytest]
testpaths = tests
norecursedirs = deps .venv
markers =
    host: numpy and PyYAML only; runs in CI
    ml: needs torch and TensorFlow from the pinned environment
    fake_driver: C runner against the fake driver (make -C hw test)
    vendor: needs the tools host (VectorBlox SDK, Libero)
    hardware: needs the kit
addopts = -rs
